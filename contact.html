  <h1 class="text-center">Contactez-nous</h1>

<body class="bg-light">

  <div class="container py-5">

    <div class="row g-4">

      <!-- FORMULAIRE -->
      <div class="col-lg-8">

        <div class="card shadow-sm">
          <div class="card-body">

            <h2 class="mb-4 text-primary">Contactez-nous</h2>

            <form>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">Nom</label>
                  <input type="text" class="form-control" placeholder="Votre nom" required>
                  <div class="text-danger small">
                  </div>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Prénom</label>
                  <input type="text" class="form-control" placeholder="Votre prénom" required>
                  <div class="text-danger small">
                  </div>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="exemple@email.com" required>
                <div class="text-danger small">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Sujet</label>

                <select class="form-select" required>
                  <option selected disabled>Choisissez un sujet</option>
                  <option>Demande d'information</option>
                  <option>Support technique</option>
                  <option>Autres</option>
                </select>
              </div>

              <div class="mb-3">
                <label class="form-label">Message</label>

                <textarea class="form-control" rows="5" placeholder="Votre message..." required></textarea>

                <div class="text-danger small">
                  Le message doit contenir au moins 20 caractères.
                </div>
              </div>

              <button type="submit" class="btn btn-primary">
                Envoyer
              </button>

            </form>

          </div>
        </div>

      </div>
    </div>

  </div>
